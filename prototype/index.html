<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>朝夕 Husafe · 两个人一本账</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<script>
  // 尽早应用主题，避免深色模式下白屏闪一下
  (function () {
    try {
      var raw = localStorage.getItem('husafe.state.v1') || localStorage.getItem('mochi.state.v1');
      var t = raw ? (JSON.parse(raw).theme || 'auto') : 'auto';
      if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div id="phone">

  <!-- 状态栏（装饰） -->
  <div class="statusbar">
    <span id="sb-time">9:41</span>
    <span class="sb-right">
      <span id="build-tag">v0.2</span>
      <span>🔒 仅本机</span><span>▮▮▮</span>
    </span>
  </div>

  <!-- 主滚动区 -->
  <main class="screen" id="screen"></main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- 遮罩 / 记账弹层 / 通用弹窗 / Toast -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>

</div>

<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  /* ------------------------------------------------------------------
     启动顺序很重要：
       1. 同步读 localStorage 里的配置（已有配置时立即可用）
       2. 否则异步读同目录的 husafe-config.json
       3. 配置就绪后再启动同步 —— 否则异步配置还没回来，
          startSync 就已经跑完并跳过了，刷新后会出现「登录了却不同步」
     ------------------------------------------------------------------ */
  (function initSync() {
    if (typeof HusafeSync === 'undefined') return;

    // 优先用内联配置（js/config.js）—— 这个不需要服务器，双击也能用
    var inline = (typeof window !== 'undefined' && window.HUSAFE_CONFIG) || null;
    var fromLS = null;
    try { fromLS = JSON.parse(localStorage.getItem('husafe.cfg') || 'null'); } catch (e) {}

    function boot(cfg) {
      if (!cfg || !cfg.url || !cfg.anonKey) return;      // 纯本地模式
      HusafeSync.configure(cfg);
      try { startSync(); } catch (e) { console.warn('同步启动失败：', e); }
      try { render(); } catch (e) {}                      // 让「我的」页反映登录状态
    }

    if (inline && inline.url && inline.anonKey) { boot(inline); return; }
    if (fromLS && fromLS.url && fromLS.anonKey) { boot(fromLS); return; }

    // 兜底：读同目录的 husafe-config.json。
    // 用 file:// 打开时这个 fetch 会被拦，属正常情况，静默忽略。
    fetch('husafe-config.json')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(boot)
      .catch(function () { /* 纯本地模式 */ });
  })();
</script>
<script>
  // 状态栏时间
  (function tick() {
    const el = document.getElementById('sb-time');
    if (!el) return;
    const d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    setTimeout(tick, 30000);
  })();
</script>

</body>
</html>
